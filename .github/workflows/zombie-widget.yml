name: Update Zombies Worked widget

on:
  push:
    branches: [main]
    paths:
      - "zombie-shuffle/data/**.csv"
      - "zombie-shuffle/scripts/build_widget.py"
      - ".github/workflows/zombie-widget.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zombie-widget
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build widget page from CSV
        run: python zombie-shuffle/scripts/build_widget.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add zombie-shuffle/index.html
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Zombies Worked widget"
            # the hunter widget commits on its own schedule; rebase in case it just pushed
            git pull --rebase --autostash
            git push
          fi
          
